# ============================================================
# BUGGY V-T — buggy off-road 4×4 a partir de imagem de referência
# ============================================================
# Referência: buggy laranja com gaiola preta, teto bege com dois
# faróis, bateria 9V sob a gaiola, câmera ESP32-CAM e LEDs na frente,
# rodas off-road grandes. Escala pela bateria 9V (48.5mm).
#
# Vista lateral (X-Z), x = TRÁS → FRENTE, 1 célula = 8mm:
#
#   z=10   ┌────── teto (laje 4mm) ──────┐◉ faróis
#   z=9    ├─travessa─trilho────travessa─●  ← nó alto
#          │poste          poste│          ╲  coluna A: viga 6-8-10
#          │                   │  [ 9V ]      ╲ (8 à frente, 6 abaixo,
#   z=3    │ ─ ─ ─ ─ lateral ─ ─ ─ ─ ─ ─ ─ ─ ─ ─●  10 células → viga de 9)
#   z=1  ┌traseira┐                   ┌nariz─┐┌─┐ cam
#   z=0  ═════════════ piso 22×8 ═════════════╪══ para-choque + LEDs
#          ( roda Ø64 )                ( roda Ø64 )
#   x:  -1 0   4         8 9   12      15  17   19   22 23
#
# Chassi rígido e "junto": toda peça encaixa em 2+ células, e as
# laterais e o miolo travam no piso por machos em toda a extensão.
# ============================================================

[assembly]
name   = "buggy-vt"
intent = "Buggy off-road 4×4 baseado em imagem: chassi laranja em blocos, gaiola preta de vigas furadas com colunas diagonais, teto bege com faróis, eletrônica como mock"

parts = [
  # --- chassi (laranja) ----------------------------------------
  { id = "piso",          type = "brick", at = [0, 0, 0],  size = [22, 8, 1], holes = "xyz", color = [0.96, 0.50, 0.12] },
  { id = "lateral_e",     type = "brick", at = [0, 0, 1],  size = [22, 1, 2], holes = "xyz", faces = { bottom = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "lateral_d",     type = "brick", at = [0, 7, 1],  size = [22, 1, 2], holes = "xyz", faces = { bottom = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "traseira",      type = "brick", at = [0, 1, 1],  size = [4, 6, 2],  holes = "z", faces = { bottom = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "nariz",         type = "brick", at = [19, 1, 1], size = [3, 6, 2],  holes = "z", faces = { bottom = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "parachoque_f",  type = "brick", at = [22, 0, 0], size = [2, 8, 1],  holes = "xz", faces = { back = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "frente_alta",   type = "brick", at = [22, 1, 1], size = [1, 6, 1],  holes = "z", faces = { bottom = "stud" }, color = [0.96, 0.50, 0.12] },
  { id = "parachoque_t",  type = "brick", at = [-1, 0, 0], size = [1, 8, 1],  holes = "xz", faces = { front = "stud" }, color = [0.96, 0.50, 0.12] },
  # berços da bateria (cinza): 7 células de vão para a 9V de 48.5mm
  { id = "berco_t",       type = "brick", at = [4, 2, 1],  size = [1, 4, 1],  holes = "z", faces = { bottom = "stud" }, color = [0.66, 0.67, 0.69] },
  { id = "berco_f",       type = "brick", at = [12, 2, 1], size = [1, 4, 1],  holes = "z", faces = { bottom = "stud" }, color = [0.66, 0.67, 0.69] },

  # --- gaiola (preta, vigas furadas) -----------------------------
  { id = "poste_te",      type = "brick", at = [1, 0, 3],  size = [1, 1, 6],  holes = "xyz", faces = { bottom = "stud", top = "stud" }, color = [0.13, 0.13, 0.14] },
  { id = "poste_td",      type = "brick", at = [1, 7, 3],  size = [1, 1, 6],  holes = "xyz", faces = { bottom = "stud", top = "stud" }, color = [0.13, 0.13, 0.14] },
  # postes do meio em x=7: em x=8 colidiriam com a ponta da coluna A
  { id = "poste_me",      type = "brick", at = [7, 0, 3],  size = [1, 1, 6],  holes = "xyz", faces = { bottom = "stud", top = "stud" }, color = [0.13, 0.13, 0.14] },
  { id = "poste_md",      type = "brick", at = [7, 7, 3],  size = [1, 1, 6],  holes = "xyz", faces = { bottom = "stud", top = "stud" }, color = [0.13, 0.13, 0.14] },
  { id = "travessa_t",    type = "brick", at = [1, 0, 9], size = [1, 8, 1],  holes = "xyz", color = [0.13, 0.13, 0.14] },
  { id = "travessa_f",    type = "brick", at = [8, 0, 9], size = [1, 8, 1],  holes = "xyz", color = [0.13, 0.13, 0.14] },
  { id = "trilho_e",      type = "brick", at = [2, 0, 9], size = [6, 1, 1],  holes = "xyz", faces = { back = "stud", front = "stud" }, color = [0.13, 0.13, 0.14] },
  { id = "trilho_d",      type = "brick", at = [2, 7, 9], size = [6, 1, 1],  holes = "xyz", faces = { back = "stud", front = "stud" }, color = [0.13, 0.13, 0.14] },
  # colunas A: nó alto na travessa, nó baixo na lateral, viga 6-8-10
  # (8 à frente, 6 abaixo → 10 células exatas, 36.9°, como na foto)
  { id = "no_alto_e",     type = "node",  at = [9, 0, 9],   dirs = [[-1, 0, 0], [4, 0, -3]] },
  { id = "no_alto_d",     type = "node",  at = [9, 7, 9],   dirs = [[-1, 0, 0], [4, 0, -3]] },
  { id = "no_baixo_e",    type = "node",  at = [17, 0, 3],  dirs = [[0, 0, -1], [-4, 0, 3]] },
  { id = "no_baixo_d",    type = "node",  at = [17, 7, 3],  dirs = [[0, 0, -1], [-4, 0, 3]] },
  { id = "coluna_a_e",    type = "strut",  from = "no_baixo_e", to = "no_alto_e" },
  { id = "coluna_a_d",    type = "strut",  from = "no_baixo_d", to = "no_alto_d" },
  # barra do painel: atravessa sobre as laterais, à frente das colunas
  # A. Um braço lateral no nó baixo invadiria a ponta da coluna A
  # (ASM-008) — por isso ela apoia nas laterais, com cavilhas.
  { id = "painel",        type = "brick", at = [18, 0, 3],  size = [1, 8, 1], holes = "xyz", color = [0.13, 0.13, 0.14] },
  # teto bege: laje sobre o quadro, cavilhas em todo o perímetro
  { id = "teto",          type = "brick", at = [1, 0, 10], size = [8, 8, 1], thickness = 4.0, holes = "z", color = [0.80, 0.69, 0.52] },

  # --- rodas Ø64 off-road, 3 células de largura ------------------
  { id = "roda_te", type = "wheel", at = [4,  -1, 0], on = "piso.right", diameter = 8, width = 3, tread = "offroad", spokes = 8 },
  { id = "roda_td", type = "wheel", at = [4,   8, 0], on = "piso.left", diameter = 8, width = 3, tread = "offroad", spokes = 8 },
  { id = "roda_fe", type = "wheel", at = [17, -1, 0], on = "piso.right", diameter = 8, width = 3, tread = "offroad", spokes = 8 },
  { id = "roda_fd", type = "wheel", at = [17,  8, 0], on = "piso.left", diameter = 8, width = 3, tread = "offroad", spokes = 8 },

  # --- eletrônica (mocks: reservam espaço, não são impressos) -----
  { id = "bateria_9v", type = "component", at = [5.5, 2.34, 1], size_mm = [48.5, 26.5, 17.5], label = "bateria 9V", color = [0.20, 0.20, 0.22, 0.55] },
  { id = "esp32cam",   type = "component", at = [19.1, 1.5, 3], size_mm = [27, 40, 4.5], label = "ESP32-CAM", color = [0.10, 0.35, 0.25, 0.75] },
  { id = "camera",     type = "component", at = [20.3, 3.5, 3.56], shape = "cyl", axis = "x", size_mm = [8, 8, 7], label = "lente", color = [0.05, 0.05, 0.05, 0.9] },
  { id = "led_f1", type = "component", at = [24, 0.6, 0.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED âmbar", color = [1.0, 0.80, 0.10, 0.85] },
  { id = "led_f2", type = "component", at = [24, 1.6, 0.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED âmbar", color = [1.0, 0.80, 0.10, 0.85] },
  { id = "led_f3", type = "component", at = [24, 5.8, 0.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED âmbar", color = [1.0, 0.80, 0.10, 0.85] },
  { id = "led_f4", type = "component", at = [24, 6.8, 0.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED âmbar", color = [1.0, 0.80, 0.10, 0.85] },
  { id = "led_a1", type = "component", at = [23, 1.6, 1.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED branco", color = [0.95, 0.95, 1.0, 0.85] },
  { id = "led_a2", type = "component", at = [23, 2.6, 1.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED branco", color = [0.95, 0.95, 1.0, 0.85] },
  { id = "led_a3", type = "component", at = [23, 4.8, 1.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED branco", color = [0.95, 0.95, 1.0, 0.85] },
  { id = "led_a4", type = "component", at = [23, 5.8, 1.2], shape = "cyl", axis = "x", size_mm = [5, 5, 6], label = "LED branco", color = [0.95, 0.95, 1.0, 0.85] },
  { id = "farol_e", type = "component", at = [8.1, 0.25, 10.5], shape = "cyl", axis = "x", size_mm = [9, 9, 7], label = "farol de teto", color = [0.95, 0.95, 1.0, 0.85] },
  { id = "farol_d", type = "component", at = [8.1, 6.6, 10.5], shape = "cyl", axis = "x", size_mm = [9, 9, 7], label = "farol de teto", color = [0.95, 0.95, 1.0, 0.85] },
]

groups = [
  { id = "chassi",  parts = ["piso", "lateral_e", "lateral_d", "traseira", "nariz", "parachoque_f", "frente_alta", "parachoque_t", "berco_t", "berco_f"], note = "Laterais, miolo e berços travam no piso por machos em toda a extensão; para-choques fecham as pontas." },
  { id = "gaiola",  parts = ["poste_te", "poste_td", "poste_me", "poste_md", "travessa_t", "travessa_f", "trilho_e", "trilho_d", "no_alto_e", "no_alto_d", "no_baixo_e", "no_baixo_d", "coluna_a_e", "coluna_a_d", "painel"], note = "Postes nas laterais, quadro do teto por cima; colunas A em diagonal 6-8-10 entre os nós; barra do painel sobre as laterais." },
  { id = "teto",    parts = ["teto", "farol_e", "farol_d"], note = "Laje bege sobre o quadro, cavilhas no perímetro." },
  { id = "rodas",   parts = ["roda_te", "roda_td", "roda_fe", "roda_fd"] },
  { id = "eletronica", parts = ["bateria_9v", "esp32cam", "camera", "led_f1", "led_f2", "led_f3", "led_f4", "led_a1", "led_a2", "led_a3", "led_a4"], note = "Mocks: só reservam espaço." },
]
